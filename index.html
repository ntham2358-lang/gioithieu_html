<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giới thiệu bản thân</title>

    <style>
        body{
            font-family: Arial;
            background-color: #dbeafe;
            text-align: center;
            padding-top: 40px;
        }

        .container{
            width: 60%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1{
            color: darkblue;
        }

        p{
            font-size: 18px;
            color: #333;
        }

        button{
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thu Thắm</h1>
        <p>Sinh viên ngành Công nghệ thông tin</p>
        <p>Yêu thích: thể thao, làm web </p>
        <button>Liên hệ với tôi</button>
    </div>

</body>
</html>
